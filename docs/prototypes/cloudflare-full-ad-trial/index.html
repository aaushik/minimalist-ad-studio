<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudflare complete-ad trial</title>
  <style>
    body { margin: 0; padding: 32px; background: #f4f5f5; color: #1d2527; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #4d575a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; background: white; border: 1px solid #e1e5e5; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; }
    figcaption { padding: 10px 2px 2px; font-weight: 600; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Cloudflare complete-ad trial</h1>
    <p>Three ads generated by FLUX.2 Klein 9B from the product photo and written design directions. They include copy and a CTA, but the product-pack text is distorted, so they are review samples rather than publishable ads. <a href="prompts.json">See the exact prompts.</a></p>
    <div class="grid">
      <figure><a href="01-water-motion.png"><img src="01-water-motion.png" alt="Water-motion ad trial"></a><figcaption>1. Water motion</figcaption></figure>
      <figure><a href="02-editorial.png"><img src="02-editorial.png" alt="Editorial ad trial"></a><figcaption>2. Editorial</figcaption></figure>
      <figure><a href="03-commerce.png"><img src="03-commerce.png" alt="Commerce ad trial"></a><figcaption>3. Commerce</figcaption></figure>
    </div>
  </main>
</body>
</html>
