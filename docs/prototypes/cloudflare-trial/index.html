<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cloudflare image trial</title>
  <style>
    body { margin: 0; padding: 32px; background: #f4f5f5; color: #1d2527; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 1200px; margin: auto; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #4d575a; }
    h2 { margin: 32px 0 16px; font-size: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    figure { margin: 0; padding: 12px; background: white; border: 1px solid #e1e5e5; border-radius: 12px; }
    img { display: block; width: 100%; height: auto; border-radius: 6px; }
    figcaption { padding: 10px 2px 2px; font-weight: 600; }
    a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Cloudflare image trial</h1>
    <p>Eight generated images. These are experiments, not finished ads. Click any image to open it at full size.</p>
    <h2>Product photo + source ad</h2>
    <div class="grid">
      <figure><a href="01-moisturizer-splash.png"><img src="01-moisturizer-splash.png" alt="Moisturizer splash trial"></a><figcaption>1. Moisturizer · splash</figcaption></figure>
      <figure><a href="02-moisturizer-editorial.png"><img src="02-moisturizer-editorial.png" alt="Moisturizer editorial trial"></a><figcaption>2. Moisturizer · editorial</figcaption></figure>
      <figure><a href="03-moisturizer-ingredient.png"><img src="03-moisturizer-ingredient.png" alt="Moisturizer ingredient trial"></a><figcaption>3. Moisturizer · ingredient</figcaption></figure>
      <figure><a href="04-sunscreen-editorial.png"><img src="04-sunscreen-editorial.png" alt="Sunscreen editorial trial"></a><figcaption>4. Sunscreen · editorial</figcaption></figure>
      <figure><a href="05-sunscreen-ingredient.png"><img src="05-sunscreen-ingredient.png" alt="Sunscreen ingredient trial"></a><figcaption>5. Sunscreen · ingredient</figcaption></figure>
    </div>
    <h2>Neutral design seed</h2>
    <div class="grid">
      <figure><a href="06-product-and-seed.png"><img src="06-product-and-seed.png" alt="Product and design seed trial"></a><figcaption>6. Product + design seed</figcaption></figure>
      <figure><a href="07-seed-only.png"><img src="07-seed-only.png" alt="Design seed only trial"></a><figcaption>7. Design seed only</figcaption></figure>
      <figure><a href="08-empty-scene.png"><img src="08-empty-scene.png" alt="Empty scene trial"></a><figcaption>8. Empty background</figcaption></figure>
    </div>
  </main>
</body>
</html>
