<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <clipPath id="product-card">
      <rect x="602" y="162" width="390" height="704" rx="30" />
    </clipPath>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#143146" flood-opacity="0.16" />
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf7" />
      <stop offset="1" stop-color="#e9f2f6" />
    </linearGradient>
  </defs>

  <rect width="1080" height="1080" fill="url(#background)" />
  <circle cx="955" cy="93" r="265" fill="#9bd5ef" opacity="0.45" />
  <circle cx="1015" cy="1015" r="320" fill="#dceeba" opacity="0.6" />

  <text x="76" y="92" fill="#101619" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Minimalist.</text>
  <text x="76" y="184" fill="#387da0" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="3">VITAMIN B5 10%</text>

  <text x="76" y="278" fill="#101619" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="700">
    <tspan x="76" dy="0">Lightweight</tspan>
    <tspan x="76" dy="82">hydration.</tspan>
    <tspan x="76" dy="82">Barrier care.</tspan>
  </text>

  <rect x="76" y="552" width="62" height="5" rx="2.5" fill="#61b8e4" />
  <text x="76" y="616" fill="#344249" font-family="Arial, Helvetica, sans-serif" font-size="27">
    <tspan x="76" dy="0">An everyday, oil-free moisturiser</tspan>
    <tspan x="76" dy="40">for oily and combination skin.</tspan>
  </text>

  <g transform="translate(76 728)">
    <rect width="460" height="54" rx="27" fill="#ffffff" opacity="0.85" />
    <text x="23" y="35" fill="#344249" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="1.2">FRAGRANCE FREE  ·  NON-COMEDOGENIC</text>
  </g>

  <g transform="translate(76 866)">
    <text x="0" y="0" fill="#101619" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">50g</text>
    <text x="72" y="0" fill="#101619" font-family="Arial, Helvetica, sans-serif" font-size="23">₹332</text>
    <rect x="0" y="44" width="272" height="72" rx="36" fill="#101619" />
    <text x="34" y="89" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">Explore moisturiser  →</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="602" y="162" width="390" height="704" rx="30" fill="#eef1f1" />
    <image href="b5-product.png" x="602" y="162" width="390" height="704" preserveAspectRatio="xMidYMid slice" clip-path="url(#product-card)" />
  </g>
  <rect x="634" y="894" width="328" height="78" rx="24" fill="#ffffff" opacity="0.88" />
  <text x="662" y="928" fill="#58717c" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4">LIGHTWEIGHT · OIL FREE</text>
  <text x="662" y="956" fill="#101619" font-family="Arial, Helvetica, sans-serif" font-size="19">With Panthenol + Hyaluronic Acid</text>

  <text x="1004" y="1034" text-anchor="end" fill="#63747b" font-family="Arial, Helvetica, sans-serif" font-size="14">Concept · 1080 × 1080</text>
</svg>
